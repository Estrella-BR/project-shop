    <div class="shelf-bar">
      @for (product of products; track product.name) {
        <div class="price-tag">
          <span class="tag-name">{{ product.name }}</span>
          <span class="tag-price">{{ product.price }} €</span>
          <span class="tag-qty">Cant: {{ product.quantity }}</span>
          <span class="tag-seller">Vendedor: {{ product.seller }}</span>
        </div>
      }
    </div>
