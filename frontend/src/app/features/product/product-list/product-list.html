<app-search-sign
  (searchChange)="onSearch($event)"
  (filtersChange)="onFilterChange($event)"
/>
@if (isLoading()) {
  
  <div class="supermarket">
    <div class="loading-container">
      <app-spinner></app-spinner>
      <p class="loading-text">Cargando productos...</p>
      <p class="loading-hint">Si es la primera vez que abres esta sección, puede tardar un poco más de lo habitual.</p>
    </div>
    
  </div>
} 
@else if (products().length === 0) {
  
  <div class="supermarket">
    <p class="empty">No se encontraron productos…</p>

  </div>
} 
@else {
  
  <div class="supermarket">
    
    <div class="shelf-top-container">
      <div class="top-frame">
      </div>
    </div>

    @for (shelf of shelves(); track $index) {
      <app-shelf [products]="shelf"></app-shelf>
    }
  </div>

   <app-pagination
      [page]="page()"
      [totalPages]="totalPages()"
      (pageChange)="loadPage($event)"
    />

}
