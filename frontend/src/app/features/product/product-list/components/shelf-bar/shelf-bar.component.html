<!-- estantería -->
<div class="shelf-bar">
  @for (product of products; track $index) {
    <div class="shelf-div">
      
      <div class="shelf-image-bg">
          <app-product-component [product]="product"></app-product-component>
      </div>

      <div class="shelf-info">
        <div class="shelf-tag">
          <span class="tag-name">{{ product.name }}</span>
          
          <div class="shelf-bottom-row">
            <span class="tag-price">{{ product.price }} €</span>

            <div class="tag-actions">
                <button
                  type="button"
                  class="tag-add"
                  [class.added]="recentlyAddedIndex() === $index"
                  (click)="addToCart(product, $index)">
                    Añadir <span class="plus-icon" aria-hidden="true">+</span>  
                </button>
                <button  type="button" (click)="open(product)">
                  Info
                </button>
              
            </div>
          </div>
        </div>
      </div>

    </div>
  }
</div>

<!-- modal (Mantenlo igual, solo asegúrate de que esté debajo) -->
@if (selected(); as p) {
  <div class="modal-backdrop" (click)="close()">
    <div
      class="modal-card"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="p.name"
      (click)="$event.stopPropagation()">

      <button class="modal-close" (click)="close()" aria-label="Cerrar">×</button>

      <div class="modal-body">
        <!-- imagen a la izquierda -->
        <div class="modal-image">
          @if (p.image) {
            <img [src]="p.image" [alt]="p.name" loading="lazy" />
          } @else {
            <div class="modal-image-placeholder" aria-hidden="true">
              {{ p.name.charAt(0) }}
            </div>
          }
        </div>

        <!-- contenido a la derecha -->
        <div class="modal-content">
          <header class="modal-header">
            <h2 class="tag-name">{{ p.name }}</h2>
            <p class="tag-price">{{ p.price }} €</p>
          </header>

          <dl class="details">
            <div><dt>Cantidad</dt><dd>{{ p.quantity }}</dd></div>
            <div><dt>Vendedor</dt><dd>{{ p.seller }}</dd></div>

            @if (p.url) {
              <div>
                <dt>URL</dt>
                <dd>
                  <a [href]="p.url" [title]="p.url"
                     target="_blank" rel="noopener noreferrer">{{ p.url }}</a>
                </dd>
              </div>
            }
          </dl>
        </div>
      </div>
    </div>
  </div>
}
