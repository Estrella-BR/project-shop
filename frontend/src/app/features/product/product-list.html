<h1>Productos</h1>

@for (product of products(); track $index) {
  <div class="product-card">
    <img [src]="product.image" [alt]="product.name" />
    <h2>{{ product.name }}</h2>
    <p>Precio: {{ product.price }}</p>
    <p>Cantidad: {{ product.cuantity }}</p>
    <a [href]="product.url" target="_blank">Ver más</a>
  </div>
}
