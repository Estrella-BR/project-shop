<div class="message" [class.user]="message().role === 'user'">

  @if (message().role === 'assistant') {
    <div class="avatar">
      <span>✦</span>
    </div>
  }

  <div class="message-content">

    @if (message().loading) {
      <div class="typing">
        <span></span>
        <span></span>
        <span></span>
      </div>
    } @else {
      <p>{{ message().content }}</p>
    }

    <time>{{ message().timestamp }}</time>

  </div>

  @if (message().role === 'user') {
    <div class="avatar user-avatar">
      <span>U</span>
    </div>
  }

</div>
